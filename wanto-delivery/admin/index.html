<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="robots" content="noindex">
<link rel="icon" href="../img/logo.svg" type="image/svg+xml">

<style>
/* 완토딜리버리 관리자 시안 (2026-11-03) — 모든 숫자는 예시 데이터. 수수료율·결제수수료·기사 단가·세율은 「설정」에서 바꾸면 전부 다시 계산된다.
   계산 규칙 (예시)
   · 주문금액(음식값) = 고객이 낸 음식값. 식당 매출
   · 중개수수료 = 음식값 × 수수료율(식당 부담)            · 배달비 = 고객이 낸 배달비
   · 플랫폼 매출 = 중개수수료 + 배달비 (부가세 포함 금액으로 봄) → 부가세 = 플랫폼 매출 × 10/110
   · 결제수수료 = (음식값 + 배달비) × 결제수수료율 (플랫폼 부담)
   · 기사 지급 = 건당 기본료 + km당 추가 → 원천세 3.3% 를 떼고 지급 (사업소득)
   · 순이익 = 플랫폼 매출 − 부가세 − 결제수수료 − 기사 지급(세전) − 쿠폰·크레딧 비용
   · 식당 정산액 = 음식값 − 중개수수료 */
:root{--ink:#14171c;--sub:#667080;--line:#e6e8ec;--bg:#f6f7f9;--card:#fff;--brand:#ff6a13;--brand-soft:#fff1e8;--ok:#0e9f6e;--ok-soft:#e3f6ec;--warn:#d97706;--bad:#dc2626;--blue:#2563eb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45;word-break:keep-all}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.num,td.n,.kpi b{font-family:Inter,'Noto Sans KR',sans-serif;font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:#14171c;color:#b9bec8;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.lg{display:flex;align-items:center;gap:8px;color:#fff;font-weight:800;font-size:18px;padding:4px 8px 18px}
.lg i{width:30px;height:30px;border-radius:9px;background:var(--brand);display:grid;place-items:center;font-style:normal;color:#fff}

aside a .c{margin-left:auto;background:#2b3038;color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
aside a.on .c{background:rgba(255,255,255,.25)}
aside .grp{font-size:11px;color:#6b7280;padding:16px 10px 6px;font-weight:700;letter-spacing:.05em}
main{padding:22px 28px 60px;min-width:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:22px;letter-spacing:-.4px}
.top .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.note{color:var(--sub);font-size:12px;margin-top:8px}

.form{display:grid;grid-template-columns:200px 1fr;gap:10px 16px;align-items:center}

.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.25}}
.hide{display:none!important}
.kpi .spark{display:flex;align-items:flex-end;gap:2px;height:26px;margin-top:10px}
.kpi .spark i{flex:1;background:#ffd9c2;border-radius:2px 2px 0 0}.kpi .spark i.t{background:var(--brand)}
.kpi.hl .spark i{background:#3a404b}.kpi.hl .spark i.t{background:var(--brand)}
.kpi .vs{display:block;font-size:11px;color:var(--sub);margin-top:6px}.kpi.hl .vs{color:#8a909b}
.ch{position:relative;margin-left:46px}
.ch-y>div{position:absolute;left:0;right:0;border-top:1px dashed #e3e5ea}.ch-y>div.z{border-top:1px solid #c9cdd4}
.ch-y span{position:absolute;right:100%;margin-right:7px;transform:translateY(-50%);font-size:10.5px;color:var(--sub);white-space:nowrap;font-family:Inter,sans-serif}
.ch-bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:3px}
.col{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px;position:relative;min-width:0}
.stk{flex:1;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:3px 3px 0 0;overflow:hidden}
.stk i{display:block;min-height:0}
.col:hover .stk{filter:brightness(.9)}
.col:hover::after{content:attr(data-v);position:absolute;top:-6px;left:50%;transform:translate(-50%,-100%);background:var(--ink);color:#fff;font-size:11px;line-height:1.5;padding:5px 8px;border-radius:6px;white-space:pre;z-index:3;pointer-events:none}
.col.t::before{content:"";position:absolute;inset:0 -1px;background:rgba(255,106,19,.07);border-radius:4px}
.ch-line{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.ch-line polyline{fill:none;stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.ch-x{display:flex;gap:3px;margin:6px 0 0 46px}.ch-x span{flex:1;min-width:0;font-size:10.5px;color:var(--sub);text-align:center;white-space:nowrap;overflow:visible;display:flex;justify-content:center}
.lgd{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--sub)}.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}.lgd i.ln{width:16px;height:2px;border-radius:1px;background:var(--ink);vertical-align:3px}
.sumrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}.sumrow div{background:#fafbfc;border-radius:10px;padding:9px 11px}.sumrow small{display:block;font-size:11px;color:var(--sub)}.sumrow b{font-family:Inter,'Noto Sans KR',sans-serif;font-size:15px}
.ops{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:14px}
.op{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.op span{font-size:12px;color:var(--sub);font-weight:600;display:block}.op b{font-family:Inter,'Noto Sans KR',sans-serif;font-size:19px;display:block;margin-top:3px}.op small{font-size:11px;color:var(--sub)}
.op .gg{height:5px;border-radius:3px;background:#eef0f3;margin-top:8px;overflow:hidden}.op .gg i{display:block;height:100%;background:var(--brand);border-radius:3px}.op .gg i.ok{background:var(--ok)}
.hm{display:grid;grid-template-columns:30px repeat(12,minmax(0,1fr));gap:3px;font-size:10.5px;color:var(--sub)}
.hm span{display:flex;align-items:center;justify-content:center}.hm i{height:24px;border-radius:4px;position:relative}
.hm i:hover::after{content:attr(data-v);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:4px;background:var(--ink);color:#fff;font-size:11px;padding:3px 7px;border-radius:5px;white-space:nowrap;z-index:3;font-style:normal}
.hmk{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;color:var(--sub)}.hmk i{width:90px;height:8px;border-radius:4px;background:linear-gradient(90deg,rgba(255,106,19,.06),rgba(255,106,19,1))}
.mix{margin-bottom:14px}.mix>div:first-child{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:6px}
.mix .b100{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px}.mix .b100 i{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;font-style:normal;min-width:0;overflow:hidden;white-space:nowrap}
.mix .k{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:11.5px;color:var(--sub)}.mix .k b{color:var(--ink);font-weight:700}.mix .k em{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
td .ib{display:flex;align-items:center;gap:8px}td .ib i{display:block;height:8px;border-radius:4px;background:var(--brand);min-width:2px}td .ib i.g{background:#ffc199}
.rk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:#f1f2f4;font-size:11px;font-weight:800;margin-right:6px}.rk.g{background:var(--brand);color:#fff}
.tbl-sm td,.tbl-sm th{padding:8px 6px;font-size:12.5px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.r21,.r11,.r111{grid-template-columns:minmax(0,1fr)}.ops{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.app{grid-template-columns:minmax(0,1fr)}.kpis{gap:10px}.kpi{padding:12px;border-radius:12px}.kpi b{font-size:18px;letter-spacing:-.3px}.kpi span{flex-wrap:wrap;gap:2px 6px;font-size:11.5px}.kpi small{font-size:11px}.card{padding:14px}.ops{grid-template-columns:repeat(2,minmax(0,1fr))}.sumrow{grid-template-columns:repeat(2,minmax(0,1fr))}.ch,.ch-x{margin-left:38px}.ch-bars,.ch-x{gap:1px}.hbar{grid-template-columns:96px 1fr 64px;font-size:12px}.top h1{font-size:19px}.mh{display:none}.ib i{display:none!important}.tbl-sm td,.tbl-sm th{padding:8px 4px;font-size:12px}.demo{font-size:11.5px}aside{position:static;height:auto;display:flex;overflow-x:auto;gap:4px;padding:10px}aside .grp,.lg small{display:none}aside a{white-space:nowrap}.lg{padding:4px 8px}main{padding:14px}.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside id="nav">
  <div class="lg"><img src="../img/logo.svg" alt="" style="width:30px;height:30px">Wanto<small>ADMIN</small></div>
  <a data-v="dash" class="on">📊 대시보드</a>
  <a data-v="orders">🧾 주문 <span class="c" id="cOrders">0</span></a>
  <div class="grp">파트너</div>
  <a data-v="rest">🍔 식당 · 정산</a>
  <a data-v="riders">🛵 기사 · 지급</a>
  <a data-v="apply">📥 입점 · 기사 신청 <span class="c">5</span></a>
  <a data-v="ads">📣 광고 <span class="c" id="cAds">2</span></a>
  <div class="grp">고객</div>
  <a data-v="cust">👤 고객</a>
  <a data-v="promo">🎁 쿠폰 · 바우처 · 크레딧</a>
  <a data-v="reviews">⭐ 리뷰</a>
  <a data-v="cs">💬 고객문의 <span class="c">7</span></a>
  <div class="grp">돈</div>
  <a data-v="tax">🧮 세금 · 리포트</a>
  <a data-v="set">⚙️ 설정</a>
  <a href="../" style="margin-top:14px;color:#8a909b">← 고객 화면으로</a>
</aside>
<main>
  <div class="demo">DEMO · 완토딜리버리 관리자 시안 (Perfect_Web). 숫자는 모두 예시이며, 수수료율·결제수수료·기사 단가·세율은 <b>설정</b>에서 바꾸면 전부 다시 계산됩니다.</div>
  <div id="view"></div>
</main>
</div>
<script>
/* ── 설정 (예시값) ── */
const CFG = {commission:15, pg:3.0, riderBase:3000, riderKm:400, vat:10, withhold:3.3, usd:1400, minOrder:12000, hoursOpen:'10:00', hoursClose:'22:00', adTop:88000, adBanner:150000, adCpc:300, adPush:30};
/* ── 예시 데이터: 같은 숫자가 나오도록 씨앗 고정 ── */
let seed = 20261103; const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
const pick = a => a[Math.floor(rnd() * a.length)];
const AREAS = ['캠프 험프리스','오산 공군기지','이태원','홍대','강남','캠프 워커(대구)','캠프 헨리(대구)','부산 해운대'];
const AW = [30,18,14,9,8,9,5,7];
const RESTS = [['Smokehouse 49','American & Grill',15],['Napoli Slice Co.','Italian & Pizza',15],['Seoul Grandma Kitchen','Korean',12],['Taqueria Lucha','Mexican',15],['Bombay Spice House','Indian',15],['Istanbul Grill','Arabic & Turkish',13],['K-Crunch Chicken','Chicken',15],['Green Bowl Lab','Veg & Health',15],['Pho Saigon Street','Asian',15],['Layer Cake Bakery','Desserts',18],['Morning Roasters','Coffee',18],['Base Mart Express','Grocery',10],['Tokyo Ramen Bar','Japanese',15],['Golden Dumpling','Chinese',15],['Lagos Kitchen','African',12],['Rio Churrasco','South American',15]];
const RIDERS = ['Mike T.','Jason K.','Daniel P.','김민수','박지훈','이서준','Chris W.','최도윤','정하늘','Ryan L.'];
const NAMES = ['Jake M.','Amira S.','Chris D.','Emily R.','Tom H.','Sarah K.','David L.','Olivia P.','James W.','Mia C.','Noah B.','Ava G.','Liam F.','Sophia N.','Ethan J.','민지','Grace Y.','Lucas V.'];
const STATUS = [['new','접수 대기'],['cook','조리 중'],['go','배달 중'],['done','완료'],['cxl','취소']];
const DAYS = 30, TODAY = new Date(2026, 10, 3);
const ALL = [];
for (let d = DAYS * 2 - 1; d >= 0; d--) {
  const day = new Date(TODAY); day.setDate(TODAY.getDate() - d);
  const wk = day.getDay(); const n = Math.round((wk === 5 || wk === 6 ? 150 : wk === 0 ? 135 : 105) * (0.85 + rnd() * 0.3) * (1 + (DAYS - d) * 0.006));
  for (let i = 0; i < n; i++) {
    const h = pick([11,11,12,12,12,13,14,15,16,17,17,18,18,18,19,19,19,19,20,20,20,21,21]);
    const ri = Math.floor(rnd() * RESTS.length); const r = RESTS[ri];
    let ai = 0, x = rnd() * 100; while (x > AW[ai]) { x -= AW[ai]; ai++; }
    const food = Math.round((12000 + rnd() * 30000) / 100) * 100;
    const km = +(0.5 + rnd() * 4.5).toFixed(1);
    const pickup = rnd() < 0.08;
    const fee = pickup ? 0 : (km < 1.5 ? 2500 : km < 3 ? 3500 : 4000);
    const pay = pick(['카드','카드','카드','카드','PayPal','PayPal','크레딧+카드']);
    const cur = rnd() < 0.3 ? 'USD' : 'KRW';
    const coupon = rnd() < 0.04 ? 5000 : 0;
    let st = 'done'; if (rnd() < 0.025) st = 'cxl';
    if (d === 0 && h >= 18) st = pick(['new','cook','go','go','done']);
    ALL.push({id: 'W-' + (20000 + ALL.length), day, d, h, m: Math.floor(rnd() * 60), ri, rest: r[0], cuisine: r[1], rate: r[2], area: AREAS[ai], food, fee, km, pickup, pay, cur, coupon, st, rider: pickup ? '-' : pick(RIDERS), cust: pick(NAMES), stars: 3 + Math.floor(rnd() * 2.4)});
  }

  ${[['18:42','Jake M.','채팅','배달 지연','Order W-24811 is 20 min late','new','새 문의'],['18:30','Amira S.','메신저','메뉴','Is the lamb kebab halal?','cook','답변 중'],['17:55','Tom H.','채팅','환불','Missing fries in my order','go','환불 검토'],['16:10','Olivia P.','이메일','바우처','Voucher code not working','done','해결'],['15:02','민지','채팅','주소','기지 안까지 배달되나요?','done','해결'],['13:40','Ethan J.','메신저','결제','PayPal charged twice','cook','답변 중'],['11:20','Grace Y.','이메일','제휴','Catering for 40 people','new','새 문의']].map(c => `<tr><td>${c[0]}</td><td>${c[1]}</td><td style="white-space:nowrap">${c[2]}</td><td style="white-space:nowrap">${c[3]}</td><td>${c[4]}</td><td><span class="st ${c[5]}">${c[6]}</span></td><td><button class="btn sm ghost">열기</button></td></tr>`).join('')}</table></div>`;

  $('view').innerHTML = `<div class="top"><h1>세금 · 리포트</h1><div class="r">${csvBtn('tax')}<button class="btn ghost">⬇ PDF 리포트</button></div></div>
  <div class="row r11" style="margin-top:0">
   <div class="card"><h3>월별 손익 <small>예시 데이터 (11월은 3일까지)</small></h3><table><tr><th></th><th class="n">10월</th><th class="n">11월 (1~3일)</th></tr>

    ${line('부가세 (매출세액)', -oct.vat, -nov.vat, `매출 × ${CFG.vat}/${100 + CFG.vat}`)}${line('결제수수료', -oct.pg, -nov.pg, `${CFG.pg}% · 매입세액 공제 대상`)}${line('기사 지급 (세전)', -oct.rider, -nov.rider)}${line('쿠폰·크레딧', -oct.coupon, -nov.coupon)}
    <tr class="tot"><td>순이익 (예상)</td><td class="n">${won(oct.net)}</td><td class="n">${won(nov.net)}</td></tr></table></div>
   <div class="card"><h3>신고 일정과 낼 돈</h3><table><tr><th>세금</th><th>대상</th><th class="n">금액</th><th>기한</th></tr>
    <tr><td><b>원천세</b> 3.3%</td><td>10월 기사 지급분</td><td class="n">${won(oct.wh)}</td><td>11/10</td></tr>
    <tr><td><b>부가세</b> (매출세액)</td><td>4분기 (10~12월)</td><td class="n">${won(q4.vat)}<br><small style="color:var(--sub)">11/3까지 누계</small></td><td>2027. 1/25</td></tr>
    <tr><td>└ 매입세액 공제</td><td>결제수수료 등의 부가세</td><td class="n">− ${won(q4.pg / 11)}</td><td></td></tr>
    <tr><td><b>간이지급명세서</b></td><td>기사 사업소득</td><td class="n">-</td><td>매달 말일</td></tr>
    <tr><td><b>식당 정산</b></td><td>10월 4주차</td><td class="n">${won(calc(orders.filter(o => o.d < 7)).restPay)}</td><td>11/10</td></tr></table>
    <p class="note">⚠️ 세율·신고 기한은 일반 기준의 예시입니다. 실제 신고는 세무사 확인이 필요합니다. 해외 결제(USD·PayPal) 환차손익은 따로 집계합니다.</p></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>결제 수단·통화</h3>${(() => { const m = {}; orders.filter(o => o.st !== 'cxl').forEach(o => { const k = o.pay + ' · ' + o.cur; m[k] = (m[k] || 0) + o.food + o.fee; }); const E = Object.entries(m).sort((a, b) => b[1] - a[1]); return E.map(([k, v]) => `<div class="hbar"><span>${k}</span><i style="width:${v / E[0][1] * 100}%"></i><span class="n">${man(v)}</span></div>`).join(''); })()}</div>`;
}
function vSet() {
  const f = (k, label, unit, note) => `<label>${label}</label><div><input type="number" step="any" data-cfg="${k}" value="${CFG[k]}"> ${unit} ${note ? `<small>${note}</small>` : ''}</div>`;
  $('view').innerHTML = `<div class="top"><h1>설정</h1><div class="r"><span class="note">값을 바꾸면 대시보드·정산·세금이 바로 다시 계산됩니다</span></div></div>
  <div class="card"><h3>수수료 · 비용</h3><div class="form">${f('commission', '중개수수료율', '%', '15면 식당별 개별 요율(10~18%)을 씀, 다른 값이면 전 식당에 일괄 적용')}${f('pg', '결제수수료율', '%', '카드·PayPal 평균')}${f('riderBase', '기사 건당 기본료', '원')}${f('riderKm', '기사 km당 추가', '원', '1km 초과분')}${f('minOrder', '최소 주문금액', '원')}</div></div>
  <div class="card" style="margin-top:14px"><h3>광고 가격</h3><div class="form">${f('adTop', '목록 맨 위', '원 / 월', '요리·지역마다 최대 2곳')}${f('adBanner', '홈 배너', '원 / 주', '지역마다 4자리')}${f('adCpc', '검색 상단', '원 / 클릭')}${f('adPush', '쿠폰 알림', '원 / 받는 사람')}</div></div>
  <div class="card" style="margin-top:14px"><h3>세금 · 환율</h3><div class="form">${f('vat', '부가세율', '%')}${f('withhold', '기사 원천세율', '%', '소득세 3% + 지방소득세 0.3%')}${f('usd', '달러 환율', '원 = $1', '고객 화면 USD 표시용')}</div></div>
  <div class="card" style="margin-top:14px"><h3>운영</h3><div class="form"><label>운영 시간</label><div><input value="${CFG.hoursOpen}" style="width:90px"> ~ <input value="${CFG.hoursClose}" style="width:90px"> <small>매일, 공휴일 포함</small></div><label>서비스 지역</label><div>${AREAS.map(a => `<span class="pill">${a}</span>`).join('')} <button class="btn sm ghost">＋ 지역</button></div><label>배달비 기준</label><div><small>1.5km 미만 ₩2,500 · 3km 미만 ₩3,500 · 그 이상 ₩4,000 (예시)</small></div></div></div>`;
}

function vAds() {
  const run = ADCAMP.filter(c => c[9] !== 'wait');
  const T = run.reduce((t, c) => ({imp: t.imp + c[4], clk: t.clk + c[5], ord: t.ord + c[6], amt: t.amt + c[7], cost: t.cost + adCost(c)}), {imp: 0, clk: 0, ord: 0, amt: 0, cost: 0});
  const st = c => c[9] === 'live' ? '<span class="st done">진행 중</span>' : c[9] === 'end' ? '<span class="st cxl">종료</span>' : c[9] === 'ok' ? '<span class="st go">승인됨</span>' : c[9] === 'no' ? '<span class="st cxl">반려</span>' : '<span class="st new">심사 대기</span>';
  const slots = [['캠프 험프리스', 1, 4], ['오산 공군기지', 0, 4], ['이태원', 1, 4], ['홍대', 0, 4], ['강남', 0, 4], ['부산 해운대', 0, 4]];
  $('view').innerHTML = `<div class="top"><h1>광고</h1><span class="live">진행 중 ${ADCAMP.filter(c => c[9] === 'live').length}건</span><div class="r">${csvBtn('ads')}</div></div>
  <div class="kpis">
   <div class="kpi hl"><span>광고 매출 (최근 30일)</span><b>${won(T.cost)}</b><small>플랫폼 매출·순이익에 들어감</small></div>
   <div class="kpi"><span>노출 · 클릭</span><b>${T.imp.toLocaleString()}</b><small>클릭 ${T.clk.toLocaleString()} · 클릭률 ${(T.clk / T.imp * 100).toFixed(1)}%</small></div>
   <div class="kpi"><span>광고로 들어온 주문</span><b>${T.ord.toLocaleString()}건</b><small>${won(T.amt)} · 전환율 ${(T.ord / T.clk * 100).toFixed(1)}%</small></div>
   <div class="kpi"><span>식당 광고 효율 (ROAS)</span><b>×${(T.amt / T.cost).toFixed(1)}</b><small>광고비 1원당 주문금액</small></div>
  </div>
  <div class="row r21">
   <div class="card scroll"><h3>광고 목록 <small>심사 대기는 승인해야 노출 시작 · 결제는 승인 뒤</small></h3><table><tr><th>식당</th><th>상품</th><th>지역</th><th>기간</th><th class="n">노출</th><th class="n">클릭</th><th class="n">주문</th><th class="n">광고비</th><th class="n">ROAS</th><th>상태</th><th></th></tr>
   ${ADCAMP.map((c, i) => `<tr><td style="white-space:nowrap"><b>${c[0]}</b></td><td style="white-space:nowrap">${ADP[c[1]][0]}<br><small style="color:var(--sub)">${ADP[c[1]][1]}</small></td><td>${c[2]}</td><td>${c[3]}</td><td class="n">${c[4].toLocaleString()}</td><td class="n">${c[5].toLocaleString()}</td><td class="n">${c[6]}</td><td class="n">${won(adCost(c))}</td><td class="n">${c[7] ? '×' + (c[7] / adCost(c)).toFixed(1) : '-'}</td><td>${st(c)}</td><td>${c[9] === 'wait' ? `<button class="btn sm" data-adok="${i}">승인</button> <button class="btn sm ghost" data-adno="${i}">반려</button>` : c[9] === 'live' ? '<button class="btn sm ghost">멈춤</button>' : ''}</td></tr>`).join('')}</table></div>
   <div class="card"><h3>홈 배너 자리 <small>지역마다 4자리, 주 단위</small></h3>${slots.map(([a, u, n]) => { const used = ADCAMP.filter(c => c[1] === 'banner' && c[2] === a && c[9] === 'live').length; return `<div class="hbar"><span>${a}</span><i style="width:${used / n * 100}%"></i><span class="n">${used}/${n}</span></div>`; }).join('')}
    <p class="note">빈자리가 많으면 첫 주 50% 할인 같은 판매 쿠폰으로 채우기</p>
    <h3 style="margin-top:16px">상품 · 가격 <small>설정에서 바꿈</small></h3><table><tr><th>상품</th><th class="n">가격</th></tr><tr><td>목록 맨 위</td><td class="n">${won(CFG.adTop)} / 월</td></tr><tr><td>홈 배너</td><td class="n">${won(CFG.adBanner)} / 주</td></tr><tr><td>검색 상단</td><td class="n">${won(CFG.adCpc)} / 클릭</td></tr><tr><td>쿠폰 알림</td><td class="n">${won(CFG.adPush)} / 명</td></tr></table></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>광고 원칙 <small>고객 앱에 그대로 안내</small></h3><p class="note" style="margin:0;line-height:1.7">· 광고 자리는 모두 「광고」 표시 · 광고 아래 순서는 거리·별점·재주문율로만 정하고 돈으로 바꿀 수 없음 · 별점 4.0 미만·위생 지적 식당은 광고 심사 반려 · 광고 매출도 부가세 대상(매출 × 10/110)</p></div>`;
}
/* ── 내보내기 (CSV) ── */
function csv(name) {
  let rows = [];
  if (name === 'orders') rows = [['주문번호','날짜','시','고객','식당','지역','방식','음식값','배달비','수수료','결제','통화','기사','상태'], ...orders.filter(inRange).map(o => [o.id, `${o.day.getMonth() + 1}/${o.day.getDate()}`, o.h, o.cust, o.rest, o.area, o.pickup ? '포장' : '배달', o.food, o.fee, Math.round(o.food * o.rate / 100), o.pay, o.cur, o.rider, o.st])];
  else if (name === 'ads') rows = [['식당','상품','지역','기간','노출','클릭','주문','광고 주문금액','광고비','상태'], ...ADCAMP.map(c => [c[0], ADP[c[1]][0], c[2], c[3], c[4], c[5], c[6], c[7], adCost(c), c[9]])];
  else if (name === 'rest') rows = [['식당','주문','음식값','수수료율','수수료','정산액'], ...restRows().map(x => [x.r[0], x.s.orders, x.s.food, x.rate, Math.round(x.s.comm), Math.round(x.s.restPay)])];
  else { const s = calc(orders.filter(inRange)); rows = [['항목','금액'], ['건수', s.orders], ['GMV', s.gmv], ['중개수수료', Math.round(s.comm)], ['배달비', s.fee], ['플랫폼 매출', Math.round(s.rev)], ['부가세', Math.round(s.vat)], ['결제수수료', Math.round(s.pg)], ['기사 지급', Math.round(s.rider)], ['원천세', Math.round(s.wh)], ['쿠폰', s.coupon], ['순이익', Math.round(s.net)]]; }
  const blob = new Blob(['﻿' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n')], {type: 'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `wanto_${name}_${range}.csv`; a.click();
}
/* ── 이동 ── */
const V = {ads: vAds, dash: vDash, orders: vOrders, rest: vRest, riders: vRiders, apply: vApply, cust: vCust, promo: vPromo, reviews: vReviews, cs: vCs, tax: vTax, set: vSet};
let cur = 'dash';
function go(v) { cur = V[v] ? v : 'dash'; document.querySelectorAll('#nav a[data-v]').forEach(a => a.classList.toggle('on', a.dataset.v === cur)); V[cur](); history.replaceState(null, '', '#' + cur); window.scrollTo(0, 0); }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-v],[data-go],[data-range],[data-ost],[data-op],[data-csv]'); if (!t) return;
  if (t.dataset.v) return go(t.dataset.v);
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.range) { range = t.dataset.range; opage = 0; return V[cur](); }
  if (t.dataset.ost) { ost = t.dataset.ost; opage = 0; return vOrders(); }
  if (t.dataset.op) { opage = Math.max(0, opage + +t.dataset.op); return vOrders(); }
  if (t.dataset.csv) return csv(t.dataset.csv);
});
document.addEventListener('click', e => { const a = e.target.closest('[data-adok],[data-adno]'); if (!a) return; const i = +(a.dataset.adok || a.dataset.adno); ADCAMP[i][9] = a.dataset.adok ? 'ok' : 'no'; $('cAds').textContent = ADCAMP.filter(c => c[9] === 'wait').length || ''; vAds(); });
document.addEventListener('input', e => {
  if (e.target.id === 'oq') { oq = e.target.value; opage = 0; vOrders(); const i = $('oq'); i.focus(); i.setSelectionRange(oq.length, oq.length); }
  if (e.target.dataset.cfg) { const v = parseFloat(e.target.value); if (!isNaN(v)) CFG[e.target.dataset.cfg] = v; }
});
$('cOrders').textContent = orders.filter(o => o.d === 0 && ['new','cook','go'].includes(o.st)).length;
go(location.hash.slice(1) || 'dash');
</script>
